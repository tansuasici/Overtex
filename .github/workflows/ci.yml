name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      # Make the real-TeX integration test fail instead of skipping.
      OVERTEX_REQUIRE_TEX: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install TeX Live
        uses: TeX-Live/setup-texlive-action@v4
        with:
          packages: |
            scheme-basic
            latexmk
            synctex
            texcount
            latexdiff
            ulem
            listings

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # Build, forward search and inverse search through the PDF preview in a real VS Code.
      - name: End-to-end tests
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:e2e
      - name: End-to-end tests
        if: runner.os != 'Linux'
        run: npm run test:e2e

      - name: Package extension
        if: matrix.os == 'ubuntu-latest'
        run: npx vsce package --out overtex.vsix

      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest'
        with:
          name: overtex-vsix
          path: overtex.vsix
