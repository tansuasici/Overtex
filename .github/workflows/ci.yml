name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      # Make the real-TeX integration test fail instead of skipping.
      OVERTEX_REQUIRE_TEX: '1'
      # Make the TexLab end-to-end steps fail instead of skipping.
      OVERTEX_E2E_TEXLAB: required
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install TeX Live
        uses: TeX-Live/setup-texlive-action@v4
        with:
          packages: |
            scheme-basic
            latexmk
            synctex
            texcount
            latexdiff
            ulem
            listings
            lineno
            marginnote

      # A pinned TexLab release, checked against the sha256 digests GitHub lists for its assets.
      - name: Install TexLab
        shell: bash
        run: |
          case "$RUNNER_OS-$RUNNER_ARCH" in
            Linux-X64)   asset=texlab-x86_64-linux.tar.gz;   sum=8697bd5e479d4584b14b7eed5c320c80ec4e1d91ebefbb6801e6bf38e9971300 ;;
            macOS-ARM64) asset=texlab-aarch64-macos.tar.gz;  sum=af7972ffd230711ba04ada9b69cc32ce9111d9196ba69538062872faefdbee56 ;;
            macOS-X64)   asset=texlab-x86_64-macos.tar.gz;   sum=6091611f756b28e1a57612b130c196df4b0bb6e22dde5cf5d890578513397daf ;;
            Windows-X64) asset=texlab-x86_64-windows.zip;    sum=cb028d44c3d2b85d36a2ed52d41a0ff43a341b1f04c500c56c4524c4eb72b316 ;;
            *) echo "no TexLab asset for $RUNNER_OS-$RUNNER_ARCH"; exit 1 ;;
          esac
          dir="$RUNNER_TEMP/texlab"
          mkdir -p "$dir"
          curl -fsSL -o "$dir/$asset" "https://github.com/latex-lsp/texlab/releases/download/v5.26.0/$asset"
          if command -v sha256sum > /dev/null; then check="sha256sum -c -"; else check="shasum -a 256 -c -"; fi
          echo "$sum  $dir/$asset" | $check
          if [[ $asset == *.zip ]]; then 7z x -o"$dir" "$dir/$asset" > /dev/null; else tar -xzf "$dir/$asset" -C "$dir"; fi
          echo "$dir" >> "$GITHUB_PATH"

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

      # Build, forward search and inverse search through the PDF preview in a real VS Code.
      - name: End-to-end tests
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:e2e
      - name: End-to-end tests
        if: runner.os != 'Linux'
        run: npm run test:e2e

      - name: Package extension
        if: matrix.os == 'ubuntu-latest'
        run: npx vsce package --out overtex.vsix

      - uses: actions/upload-artifact@v7
        if: matrix.os == 'ubuntu-latest'
        with:
          name: overtex-vsix
          path: overtex.vsix
