name: Release

# Push a tag like v0.1.0 (matching "version" in package.json) to publish.
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  # Marketplace trusted publishing: vsce exchanges the workflow's OIDC token for a short-lived credential.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      OVERTEX_REQUIRE_TEX: '1'
      # Job level so the Open VSX step's condition can see whether it is set.
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check that the tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi

      - name: Install TeX Live
        uses: TeX-Live/setup-texlive-action@v4
        with:
          packages: |
            scheme-basic
            latexmk
            synctex
            texcount

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: xvfb-run -a npm run test:e2e

      - name: Package
        run: npx vsce package --out overtex-${GITHUB_REF_NAME#v}.vsix

      - name: Publish to the Visual Studio Marketplace
        run: npx vsce publish --oidc --packagePath overtex-${GITHUB_REF_NAME#v}.vsix

      # Open VSX serves VSCodium, Cursor and other VS Code forks. Skipped until OVSX_PAT is set.
      - name: Publish to Open VSX
        if: env.OVSX_PAT != ''
        run: npx --yes ovsx publish overtex-${GITHUB_REF_NAME#v}.vsix

      - name: GitHub release
        run: gh release create "$GITHUB_REF_NAME" overtex-${GITHUB_REF_NAME#v}.vsix --title "$GITHUB_REF_NAME" --notes "See [CHANGELOG.md](https://github.com/tansuasici/Overtex/blob/main/CHANGELOG.md)."
        env:
          GH_TOKEN: ${{ github.token }}
